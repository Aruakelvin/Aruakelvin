[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incentive-analyzer"
version = "0.1.0"
description = "Cross-chain scanner for DeFi incentives (LP, trading, lending, staking) across protocols"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
incentives = "incentive_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["incentive_analyzer*"]
